spring:
  application:
    name: cineplex-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/cineplex_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 60000

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: 8080
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:9a6747f3b64f4d228f41334c979d51d4512e2f38f4d9241b3a1a6b0c2e3f4a5b}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  booking:
    seat-hold-duration-seconds: 300 # 5 minutes
    cleaning-buffer-minutes: 15
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-name: ${MINIO_BUCKET_NAME:cineplex}
    public-url: ${MINIO_PUBLIC_URL:http://localhost:9000/cineplex}
  payment:
    frontend-return-url: ${PAYMENT_FRONTEND_RETURN_URL:http://localhost:3000/payment/callback}
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE:0H3TNJQV}
      hash-secret: ${VNPAY_HASH_SECRET:ZGYMLWUZOAPQMKTOGRJFARDWFBPKGGUB}
      pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      return-url: ${VNPAY_RETURN_URL:${PAYMENT_FRONTEND_RETURN_URL:http://localhost:3000/payment/callback}}
    momo:
      partner-code: ${MOMO_PARTNER_CODE:MOMOLRJZ20181206}
      access-key: ${MOMO_ACCESS_KEY:mTCKt9W3eU1m39TW}
      secret-key: ${MOMO_SECRET_KEY:SetA5RDnLHvt51AULf51DyauxUo3kDU6}
      endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
      redirect-url: ${MOMO_REDIRECT_URL:${PAYMENT_FRONTEND_RETURN_URL:http://localhost:3000/payment/callback}}
      ipn-url: ${MOMO_IPN_URL:${PAYMENT_FRONTEND_RETURN_URL:http://localhost:3000/payment/callback}}
    zalopay:
      app-id: ${ZALOPAY_APP_ID:2553}
      key1: ${ZALOPAY_KEY1:PcY4iZIKFCIdgZvA6ueMcMHHUbRLYjPL}
      key2: ${ZALOPAY_KEY2:kLtgPl8HHhfvMuD2wKfgccZZ4WYn9KeB}
      endpoint: ${ZALOPAY_ENDPOINT:https://sb-openapi.zalopay.vn/v2/create}
