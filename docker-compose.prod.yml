services:
  postgres:
    image: postgres:16-alpine
    container_name: cineplex-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      POSTGRES_DB: ${POSTGRES_DB:-cineplex_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    # Trong môi trường production, database chỉ truy cập nội bộ qua Docker network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cineplex_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cineplex-net

  redis:
    image: redis:7-alpine
    container_name: cineplex-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cineplex-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: cineplex-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - cineplex-net

  flyway:
    image: flyway/flyway:10-alpine
    container_name: cineplex-flyway
    command: -connectRetries=60 migrate
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cineplex_db}
      FLYWAY_USER: ${POSTGRES_USER:-postgres}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      FLYWAY_DEFAULT_SCHEMA: public
    volumes:
      - ./backend/src/main/resources/db/migration:/flyway/sql
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cineplex-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cineplex-backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cineplex_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-guest}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-cineplex}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:3000/cineplex}
      JWT_SECRET: ${JWT_SECRET:-9a6747f3b64f4d228f41334c979d51d4512e2f38f4d9241b3a1a6b0c2e3f4a5b}
      PAYMENT_FRONTEND_RETURN_URL: ${PAYMENT_FRONTEND_RETURN_URL:-http://localhost:3000/payment/callback}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-0H3TNJQV}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-ZGYMLWUZOAPQMKTOGRJFARDWFBPKGGUB}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-${PAYMENT_FRONTEND_RETURN_URL:-http://localhost:3000/payment/callback}}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-MOMOLRJZ20181206}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-mTCKt9W3eU1m39TW}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-SetA5RDnLHvt51AULf51DyauxUo3kDU6}
      MOMO_ENDPOINT: ${MOMO_ENDPOINT:-https://test-payment.momo.vn/v2/gateway/api/create}
      MOMO_REDIRECT_URL: ${MOMO_REDIRECT_URL:-${PAYMENT_FRONTEND_RETURN_URL:-http://localhost:3000/payment/callback}}
      MOMO_IPN_URL: ${MOMO_IPN_URL:-${PAYMENT_FRONTEND_RETURN_URL:-http://localhost:3000/payment/callback}}
      ZALOPAY_APP_ID: ${ZALOPAY_APP_ID:-2553}
      ZALOPAY_KEY1: ${ZALOPAY_KEY1:-PcY4iZIKFCIdgZvA6ueMcMHHUbRLYjPL}
      ZALOPAY_KEY2: ${ZALOPAY_KEY2:-kLtgPl8HHhfvMuD2wKfgccZZ4WYn9KeB}
      ZALOPAY_ENDPOINT: ${ZALOPAY_ENDPOINT:-https://sb-openapi.zalopay.vn/v2/create}
      ZALOPAY_REDIRECT_URL: ${ZALOPAY_REDIRECT_URL:-${PAYMENT_FRONTEND_RETURN_URL:-http://localhost:3000/payment/callback}}
    depends_on:
      flyway:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - cineplex-net

  minio:
    image: minio/minio:latest
    container_name: cineplex-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - cineplex-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cineplex-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - cineplex-net
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:

networks:
  cineplex-net:
    driver: bridge
  dokploy-network:
    external: true
